<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프롬프트 서재</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: 서재형 — 왼쪽 서가(PART 1~3 목차) + 오른쪽 열람대(카드 2열), 상단 검색·필터 */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --soft:#f1f3f8; --ink:#12151f; --muted:#646b7d; --line:#e6e8ef;
  --accent:#3d5afe; --accent-soft:#eef1ff; --p1:#3d5afe; --p2:#0f8a64; --p3:#e0671f; --p4:#8b4fe0; --p5:#d2416e; --real:#0f8a64; --real-soft:#e3f5ee; --star:#f2a900;
  --code:#141a2b; --code-fg:#e9ecf5; --code-dim:#8d95ad; --hi:#ffd76a; --where:#8fe3c0;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --x-surface:var(--surface); --x-line:var(--line); --x-ink:var(--ink); --x-muted:var(--muted); --x-accent:var(--accent); --x-soft:var(--soft); --x-code:var(--code); --x-code-fg:var(--code-fg); --x-r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1019; --surface:#151926; --soft:#1c2131; --ink:#e8eaf2; --muted:#9aa1b6; --line:#252b3d;
  --accent:#8ea0ff; --accent-soft:#1e2545; --real:#5ed2a8; --real-soft:#12302a; --star:#ffc93c;
  --code:#0a0d16; --code-fg:#e9ecf5; --code-dim:#7d85a0; --p1:#8ea0ff; --p2:#5ed2a8; --p3:#ffa36b; --p4:#c4a0ff; --p5:#ff8fb1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1019; --surface:#151926; --soft:#1c2131; --ink:#e8eaf2; --muted:#9aa1b6; --line:#252b3d;
  --accent:#8ea0ff; --accent-soft:#1e2545; --real:#5ed2a8; --real-soft:#12302a; --star:#ffc93c;
  --code:#0a0d16; --code-fg:#e9ecf5; --code-dim:#7d85a0; --p1:#8ea0ff; --p2:#5ed2a8; --p3:#ffa36b; --p4:#c4a0ff; --p5:#ff8fb1; color-scheme:dark}
/* shared: category extras + prompt figures. Each page maps the --x-* tokens. */
.x-extras{display:flex;flex-direction:column;gap:12px}
.x-compare{width:100%;border-collapse:separate;border-spacing:0;background:var(--x-surface);border:1px solid var(--x-line);border-radius:var(--x-r);overflow:hidden;font-size:14px}
.x-compare th{text-align:left;white-space:nowrap;padding:11px 16px;width:1%;color:var(--x-accent);font-weight:700;vertical-align:top}
.x-compare td{padding:11px 16px 11px 0;color:var(--x-ink)}
.x-compare tr+tr>*{border-top:1px solid var(--x-line)}
.x-rules,.x-tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.x-rule,.x-tips>div{background:var(--x-surface);border:1px solid var(--x-line);border-radius:var(--x-r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.6}
.x-rule b,.x-tips b{font-size:14.5px;color:var(--x-ink)}
.x-rule>span,.x-tips span{color:var(--x-muted)}
.x-pair{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.x-pair s{color:var(--x-muted)} .x-pair i{font-style:normal;color:var(--x-muted)} .x-pair em{font-style:normal;color:var(--x-accent);font-weight:500}
.x-check{background:var(--x-surface);border:1px solid var(--x-line);border-radius:var(--x-r);padding:14px 18px}
.x-check b{font-size:14.5px;color:var(--x-ink)}
.x-check ul{margin:8px 0 0;padding:0;list-style:none;columns:2 230px;column-gap:24px;font-size:13.5px;color:var(--x-ink)}
.x-check li{padding:4px 0 4px 24px;position:relative;break-inside:avoid}
.x-check li::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border:1.5px solid var(--x-accent);border-radius:4px}
.x-fig{margin:0;background:var(--x-surface);border:1px solid var(--x-line);border-radius:var(--x-r);padding:14px 16px;font-size:12.5px;color:var(--x-ink)}
.x-fig figcaption{margin-top:10px;color:var(--x-muted);font-size:11.5px}
.x-gh,.x-gr{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:8px}
.x-gh{grid-template-columns:78px repeat(5,minmax(0,1fr));color:var(--x-muted);text-align:center;font-size:11px}
.x-gr{margin-top:6px}
.x-gt{display:grid;grid-template-columns:repeat(5,1fr);height:14px;background:var(--x-soft);border-radius:4px}
.x-gt i{display:block;border-radius:4px}
.g0{background:#4f6bed}.g1{background:#1f9b78}.g2{background:#e08a3c}.g3{background:#9a62e8}
.x-cr{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 64px;gap:10px;align-items:center;margin-top:6px}
.x-cr:first-child{margin-top:0}
.x-ct{height:10px;background:var(--x-soft);border-radius:99px;overflow:hidden}
.x-ct i{display:block;height:100%;border-radius:99px;background:#1f9b78}
.x-ct i.low{background:#e0533f}
.x-cr b{text-align:right;font-variant-numeric:tabular-nums}
.x-si{border:1.5px solid var(--x-ink);border-radius:8px;padding:8px 12px;font-size:14px}
.x-sl{color:var(--x-muted);font-size:11.5px;margin:8px 0 6px}
.x-sm{background:var(--x-code);color:var(--x-code-fg);border-radius:8px;padding:10px 12px;line-height:1.6}
.x-sm b{color:#ffd76a}
.x-st{display:flex;gap:6px;margin-top:8px}
.x-st span{background:var(--x-soft);color:var(--x-accent);font-weight:700;padding:2px 8px;border-radius:5px}
.x-game{background:var(--x-code);color:var(--x-code-fg);border-color:transparent}
.x-gs{background:rgba(255,255,255,.08);padding:6px 10px;border-radius:6px;color:#ffd76a;font-weight:700}
.x-game p{margin:8px 0}
.x-game ol{margin:0;padding:0;list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:4px}
.x-game li{counter-increment:c;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:4px 10px}
.x-game li::before{content:counter(c) ". "}
.x-game figcaption{color:rgba(255,255,255,.55)}
.x-steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.x-steps li{counter-increment:s;display:flex;gap:12px;align-items:baseline;background:var(--x-soft);border-radius:8px;padding:8px 12px;color:var(--x-ink)}
.x-steps li::before{content:counter(s);font-weight:800;color:var(--x-accent);font-variant-numeric:tabular-nums;min-width:10px}
.x-flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;counter-reset:f}
.x-flow li{counter-increment:f;position:relative;background:var(--x-surface);border:1px solid var(--x-line);border-top:3px solid var(--x-accent);border-radius:var(--x-r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--x-muted)}
.x-flow li b{font-size:14.5px;color:var(--x-ink)}
.x-flow li b::before{content:counter(f) ". ";color:var(--x-accent)}
.x-tree .x-tl{padding:8px 12px;border-radius:8px;font-size:13px;margin-top:6px;background:var(--x-soft);color:var(--x-ink)}
.x-tree .x-tl.l0{margin-top:0;background:var(--x-code);color:var(--x-code-fg);font-weight:700}
.x-tree .x-tl.l1{background:color-mix(in srgb,#4f6bed 14%,var(--x-surface))}
.x-tree .x-tl.l2{background:color-mix(in srgb,#e8b62c 20%,var(--x-surface))}
.x-tree .x-tl.l3{background:color-mix(in srgb,#1f9b78 16%,var(--x-surface))}
@media (max-width:520px){.x-tree .x-tl{margin-left:0!important}}
.x-table{padding:0;overflow:hidden}
.x-table .x-tt{margin:0;padding:12px 16px;font-size:13.5px;font-weight:700;color:var(--x-ink);border-bottom:1px solid var(--x-line)}
.x-table>figcaption:last-child{padding:0 16px 12px}
.x-tw{overflow-x:auto}
.x-table table{width:100%;border-collapse:collapse;font-size:13px}
.x-table thead th{background:var(--x-code);color:var(--x-code-fg);font-weight:700;text-align:left;padding:9px 14px;white-space:nowrap}
.x-table tbody th{text-align:left;font-weight:700;padding:9px 14px;white-space:nowrap;color:var(--x-ink)}
.x-table td{padding:9px 14px;color:var(--x-muted)}
.x-table tbody tr+tr>*{border-top:1px solid var(--x-line)}
.x-time{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0;overflow:hidden;text-align:center}
.x-time div{padding:14px 8px 12px;display:flex;flex-direction:column;border-top:4px solid #4f6bed}
.x-time div:nth-child(2){border-top-color:#e8b62c}
.x-time div:nth-child(3){border-top-color:#1f9b78}
.x-time b{font-size:15px}
.x-time span{font-size:12px;color:var(--x-muted)}
.x-time figcaption{grid-column:1/-1;margin:0;padding:0 14px 12px}
.x-ac{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.x-ac span{background:var(--x-soft);border-radius:6px;padding:6px 0;text-align:center;font-size:12px;color:var(--x-muted);font-variant-numeric:tabular-nums}
.x-ac span b{color:var(--x-ink)}
.x-ac span.top{background:#ffd76a;color:#3a2c00}
.x-ac span.top b{color:#1a1400}
.x-aa{text-align:center;font-size:12px;color:var(--x-muted);margin:8px 0 6px;font-weight:700}
.x-ab{background:var(--x-code);color:var(--x-code-fg);border-radius:8px;text-align:center;padding:9px;font-weight:800;font-size:14px}
.tgl{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--x-line);background:var(--x-surface);color:var(--x-ink);cursor:pointer;flex:none}
.tgl svg{width:18px;height:18px}
.tgl:hover{border-color:var(--x-muted)}
.copyall{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font:inherit;font-size:13px;font-weight:700;background:#ffd76a;color:#2a2000;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
.copyall:hover{filter:brightness(1.04)}
.copyall.ok{background:#1f9b78;color:#fff}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px 28px;padding-block:12px 10px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:11px}
.mk{width:34px;height:34px;border-radius:10px;background:var(--code);color:var(--hi);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:0}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1.2}
.brand span{font-size:11.5px;color:var(--muted)}
.search{position:relative;max-width:540px;width:100%;justify-self:center}
.search input{width:100%;font-size:14px;padding:10px 42px 10px 40px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);transition:background .15s,border-color .15s}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--muted);background:var(--surface)}
.tr{display:flex;align-items:center;gap:14px}
.count{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:500;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
.chip:hover{color:var(--ink);border-color:color-mix(in srgb,var(--muted) 50%,var(--line))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
.sep{flex:none;width:1px;background:var(--line);margin:5px 4px}

.wrap{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:236px minmax(0,1fr);gap:48px;
  padding-block:32px 110px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 128px);align-self:start;display:flex;flex-direction:column;gap:1px;max-height:calc(100vh - 150px);overflow:auto;scrollbar-width:thin;padding-right:4px}
.nav .lbl{display:flex;gap:8px;align-items:baseline;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:18px 12px 6px}
.nav .lbl:first-child{margin-top:0}
.nav .lbl i{font-style:normal;color:var(--pc)}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14px}
.nav a span{display:flex;gap:9px}
.nav a span i{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
.nav a:hover{background:var(--surface)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav a.on span i{color:var(--accent)}
.nav a em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{margin-top:20px;padding:16px 12px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:7px}
.legend mark{background:transparent;color:var(--accent);font-weight:700}
.legend kbd{font-family:inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface)}

.hero{margin-bottom:56px}
.hero h1{font-size:clamp(28px,3.6vw,40px);font-weight:800;letter-spacing:-.045em;line-height:1.2;margin:0 0 12px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero>p{margin:0;color:var(--muted);font-size:15.5px;max-width:58ch}
.stats{display:flex;gap:28px;margin:22px 0 26px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:28px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:12.5px;color:var(--muted)}
.parts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1240px){.parts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px;text-decoration:none;color:var(--ink);position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.pcard::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--pc)}
.pcard:hover{border-color:var(--pc);transform:translateY(-2px)}
.pcard small{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--pc)}
.pcard strong{font-size:17px;font-weight:800;letter-spacing:-.03em}
.pcard span{font-size:12.5px;color:var(--muted);line-height:1.55}
.part{display:flex;align-items:center;gap:14px;margin:4px 0 28px}
.part b{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--surface));padding:4px 10px;border-radius:99px;white-space:nowrap}
.part strong{font-size:20px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.part span{font-size:13.5px;color:var(--muted)}
.part::after{content:"";flex:1;height:1px;background:var(--line)}
section.cat{scroll-margin-top:140px;margin-bottom:72px}
.cat-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 20px;margin-bottom:20px}
.cat-h .num{grid-row:1/3;font-size:44px;font-weight:800;line-height:1;color:color-mix(in srgb,var(--pc) 35%,var(--line));letter-spacing:-.04em;font-variant-numeric:tabular-nums}
section.cat{--x-accent:var(--pc)}
.cat-h .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pc);font-weight:700}
.cat-h h2{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.cat-h p{grid-column:2;margin:8px 0 0;color:var(--muted);max-width:62ch;font-size:15px}
.when{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin-bottom:12px}
.when div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-size:13.5px;color:var(--muted);line-height:1.55}
.when b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.when b::before{content:"💼 ";font-size:12px}
.cat .x-extras{margin-bottom:20px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:14px;padding:20px;transition:box-shadow .2s,border-color .2s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--line));box-shadow:0 14px 34px -22px rgba(18,21,31,.35)}
.meta{display:flex;gap:8px;align-items:center;font-size:12px}
.kind{padding:3px 9px;border-radius:99px;font-weight:700}
.kind.k-실습{background:var(--accent-soft);color:var(--accent)}
.kind.k-참고{background:var(--soft);color:var(--muted)}
.kind.k-실전{background:var(--real-soft);color:var(--real)}
.tool{color:var(--muted);font-weight:500}
.fav{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--line);padding:2px;display:grid;place-items:center;border-radius:6px}
.fav svg{width:20px;height:20px}
.fav:hover{color:var(--muted)}
.fav[aria-pressed="true"]{color:var(--star)}
.card h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.card h3 small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:3px;letter-spacing:0}
.desc{margin:-6px 0 0;font-size:14px;color:var(--muted);line-height:1.6}
.boxes{display:flex;flex-direction:column;gap:8px}
.box{background:var(--code);color:var(--code-fg);border-radius:14px;overflow:hidden}
.box-h{display:flex;align-items:flex-start;gap:12px;padding:12px 12px 0 16px}
.box-h .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.box-h .l b{font-size:12.5px;color:var(--hi);font-weight:700}
.box-h .l span{font-size:11.5px;color:var(--where)}
.copy{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:9px;padding:6px 12px;cursor:pointer;transition:background .15s}
.copy svg{width:14px;height:14px}
.copy:hover{background:rgba(255,255,255,.2)}
.copy.ok{background:#1f9b78}
.box pre{margin:0;padding:10px 16px 16px;font-family:var(--sans);font-size:13.5px;line-height:1.8;letter-spacing:-.005em;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.box.clamp pre{max-height:16em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.more{display:block;width:100%;background:none;border:0;border-top:1px solid rgba(255,255,255,.08);color:var(--code-dim);font-size:12.5px;padding:9px;cursor:pointer}
.more:hover{color:var(--code-fg)}
mark.v{background:rgba(255,215,106,.14);color:var(--hi);padding:0 3px;border-radius:4px}
.note{margin:0;font-size:13px;color:var(--muted);line-height:1.6;background:var(--soft);border-radius:10px;padding:10px 14px}
.note::before{content:"💡 "}

.empty{padding:70px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:500;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100vw - 40px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.totop{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 8px 22px -12px rgba(0,0,0,.4);font-size:18px}
@media (max-width:1000px){
  .top-in{grid-template-columns:minmax(0,1fr) auto}
  .search{grid-column:1/-1;grid-row:2;max-width:none}
  .chips{grid-row:3}
  .wrap{grid-template-columns:minmax(0,1fr);gap:18px;padding-top:16px}
  .nav{position:static;flex-direction:row;overflow-x:auto;max-height:none;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .nav .lbl,.legend{display:none}
  .nav a{white-space:nowrap;background:var(--surface);border:1px solid var(--line);flex:none}
  .grid{grid-template-columns:minmax(0,1fr)}
  section.cat{scroll-margin-top:180px}
}
@media (max-width:1000px){.parts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.parts{grid-template-columns:minmax(0,1fr)}.cat-h .num{font-size:32px}.cat-h h2{font-size:24px}.cat-h p{grid-column:1/-1}.card{padding:16px}.part span{display:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
@media (prefers-reduced-motion:reduce){.toast,.card,.chip{transition:none}}
</style>

    desc:'"겉으로 하는 말 vs 속마음"까지 보여 줍니다. 대표는 "디지털 전환 필수!"라고 말하지만 속으로는 비용을 걱정하죠.',

  { t:'시간 레이어: 과거 · 현재 · 미래', sub:'실습 ③', kind:'실습', tool:'Gemini', where:'새 채팅에 붙여넣기 → Enter',

    text:`아래 주제를 3개의 시간 레이어에서 동시 분석하세요

 과거의 결정이 현재에 어떤 모습으로 나타나는가?

  { t:'문화권 관점', sub:'응용 · 단어만 바꾸기', kind:'실습', tool:'Gemini', where:'새 채팅에 붙여넣기 → Enter',

문화권 : 한국 / 필리핀 / 베트남 / 미국

    note:'2차 프로젝트에서 제품군과 나라가 정해지면, 우리나라와 그 나라의 문화 차이를 이렇게 먼저 조사해 보세요.' },
  { t:'AI 토론 쇼 — 내가 사회자', sub:'추가 실습 · 3인 토론 시뮬레이션', kind:'실습', tool:'Gemini', where:'새 채팅 → 같은 채팅에서 사회자로 진행',

    steps:['주제를 내가 정하기 (괄호 바꾸기)','라운드가 끝나면 사회자로 질문 던지기 · 예: "김대표님, 교수님 말에 반박해 보세요"','3라운드 후 "결론" 입력'],
    text:`지금부터 토론 쇼를 진행합니다. 나는 사회자입니다.

  { t:'4명의 관점으로 웹페이지 리뷰', sub:'바이브 코딩 · 다중 관점', kind:'실전', tool:'Claude', where:'새 채팅',

    text:`아래 웹페이지를 4명의 관점에서 동시에 리뷰해 주세요

4) 보안 전문가: 위험한 부분은?
각 관점에서 문제 2개씩 → 마지막에 "가장 먼저 고칠 3가지"를 우선순위로
\`\`\`
(내 HTML 코드 붙여넣기 · 없으면 "무역 용어 퀴즈 페이지"라고 쓰기)
\`\`\`` }
  ]},
{ id:'cot', name:'심사숙고 (CoT)', en:'Chain of Thought',
  summary:'즉답은 "확률", 생각은 "추론". 가볍게 물으면 가장 흔한 답이 바로 나오지만, "깊게, 단계별로 생각해 줘"가 들어가면 AI가 문제를 따져 보고 스스로 점검할 시간을 더 씁니다. CoT = Chain of Thought, 생각의 사슬이에요.',
  compare:[['가볍게 물으면','가볍게 답합니다. 바로 나오는 답은 가장 흔한 답(확률)이에요.'],['"깊게, 단계별로"','문제를 따져 보고 스스로 점검합니다. Gemini·ChatGPT의 "심층 분석", "생각 모드"도 같은 원리예요.']],
  table:{ title:'깊게 생각하게 만드는 4가지 장치', head:['장치','하는 일'], rows:[['① 사고 공간','답을 쓰기 전에 먼저 생각하라'],['② 단계 강제','건너뛸 수 없는 중간 단계를 설계 (1단계 → 2단계 → 3단계) · 레시피 패턴과 같아요'],['③ 자기 검증','답을 낸 뒤 스스로 검토하게 함 · 리플렉션 패턴과 같아요'],['④ 불확실성','아는 것과 모르는 것을 구분하게 함 · "모르면 모른다고, 추측이면 추측이라고 표시해"로 환각을 줄여요']], note:'CoT(생각의 사슬)는 CTO(최고기술책임자)와 철자가 비슷해 헷갈리기 쉬워요.' },
  when:[['비싼 판단','진출 국가 선택, 가격 결정처럼 틀리면 비싼 판단은 단계별 + 중간 결론'],['반론 먼저','"반론 먼저"로 내 계획의 약점부터 듣기'],['상사 설득','보고서에 판단 과정이 보이니 상사 설득이 쉬워짐']],
  prompts:[
  { t:'같은 질문, 단계적 사고로 바꾸기', sub:'실습 · ① vs ② 비교', kind:'실습', tool:'Gemini', where:'새 채팅 ①',
    desc:'두 개를 차례로 넣고 비교해 보세요. ②는 Step 1, Step 2…처럼 생각의 과정이 보입니다.',
    label:'① 일반 질문',
    text:`우리 회사가 베트남에 진출해야 할까?`,
    more:[{ t:'② 심사숙고 질문 (CoT)', where:'Gemini 새 채팅 ② → ①과 비교', text:`우리 회사가 베트남에 진출해야 할지 단계별로 생각하면서 판단해줘
각 단계에서 내린 중간 결론을 보여줘` }],
    note:'"우리 회사" 자리에 업종·규모를 넣으면(컨텍스트) 훨씬 정확해져요. 예: "직원 30명 화장품 제조사"' },
  { t:'반론 먼저', sub:'실습 · CoT + 반론 요청', kind:'실습', tool:'Gemini', where:'새 채팅에 붙여넣기 → Enter',
    desc:'내 계획의 약점부터 듣고, 그걸 바탕으로 준비할 것을 단계별로 받습니다.',
    text:`"베트남에 화장품을 수출하면 무조건 성공한다"는 내 주장에 대해
먼저 가장 강력한 반론 3가지를 제시하고,
그 반론을 고려했을 때 내가 준비해야 할 것을 단계별로 정리해줘` },
  { t:'즉답 vs 생각, 함정 퀴즈 대결', sub:'추가 실습', kind:'실습', tool:'Gemini', where:'새 채팅 ①',
    desc:'같은 함정 문제를 즉답과 단계별 사고로 각각 풀게 해서 비교합니다.',
    steps:['먼저 나도 10초 안에 답 써 보기','A를 Gemini 새 채팅에 → AI의 즉답 확인','B는 A 문제 3개를 같이 붙여서 다른 새 채팅에','Claude에도 A·B를 넣어 보고 누가 더 잘 풀었나 비교'],
    label:'A · 즉답만 시키기',
    text:`아래 3문제에 설명 없이 숫자만 바로 답하세요.
1) 배트와 공을 합쳐 1,100원. 배트는 공보다 1,000원 비싸다. 공은 얼마?
2) 기계 5대가 5분에 부품 5개를 만든다. 기계 100대가 부품 100개를 만들려면 몇 분?
3) 연못의 연잎이 매일 2배로 늘어 48일 만에 연못을 다 덮는다. 절반을 덮는 건 며칠째?`,
    more:[{ t:'B · 생각하게 하기', where:'Gemini 새 채팅 ② (A 문제와 같이 붙여넣기)', text:`위 3문제를 단계별로 생각하며 풀고, 각 문제마다 "흔히 하는 실수"도 알려 주세요.` }],
    note:'사람도 AI도 급하면 틀립니다. 중요한 질문일수록 "단계별로"를 붙이세요.' },
  { t:'점수 저장 기능, 생각하고 만들기', sub:'바이브 코딩 · 심사숙고', kind:'실전', tool:'Claude', where:'새 채팅',
    desc:'바이브 코딩에서 제일 비싼 실수는 처음 방향을 잘못 잡는 것. 만들기 전에 생각하게 합니다.',
    text:`무역 용어 퀴즈 웹앱에 "점수 저장" 기능을 넣고 싶어요.
바로 코드를 쓰지 말고 단계별로 생각해 주세요.
Step 1: 저장 방법 후보 3가지 (쉬운 말로)
Step 2: 나는 코딩 초보, HTML 한 파일만 다룸 → 각 후보의 난이도
Step 3: 각 후보의 가장 큰 반대 의견 1개
Step 4: 중간 결론들을 바탕으로 최종 추천 1개 + 이유
그다음에 추천한 방법으로 코드를 만들어 주세요.` }
  ]},

function esc(s){return s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}
function markVars(s){return esc(s).replace(/\{[^{}\n&]{1,30}\}/g,m=>'<mark class="v">'+m+'</mark>');}
function copyText(text, btn, fallbackEl){
  const done=()=>{const o=btn.dataset.label||btn.textContent;btn.dataset.label=o;btn.textContent='복사됨 ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok');},1400);if(window.onCopied)window.onCopied(btn);};
  const fb=()=>{if(!fallbackEl)return;const r=document.createRange();r.selectNodeContents(fallbackEl);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='선택됨 · Ctrl+C';};

}

function initTheme(btn){
  const root=document.documentElement;
  const sys=()=>matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  let t=null;try{t=localStorage.getItem('pp-theme');}catch(e){}
  if(t)root.dataset.theme=t;
  const cur=()=>root.dataset.theme||sys();
  const paint=()=>{const d=cur()==='dark';btn.innerHTML=d?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';btn.setAttribute('aria-label',d?'밝은 화면으로':'어두운 화면으로');};
  btn.addEventListener('click',()=>{const n=cur()==='dark'?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('pp-theme',n);}catch(e){}paint();});
  paint();
}

const ICON_COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const ICON_STAR='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
const nav=document.getElementById('nav'), main=document.getElementById('main'), chips=document.getElementById('chips');
let filter='', query='', favs={};
try{favs=JSON.parse(localStorage.getItem('ps-favs')||'{}');}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('ps-favs',JSON.stringify(favs));}catch(e){}};
const ALL=Object.values(BYID);
const countOf=f=>ALL.filter(p=>f==='★'?favs[p.id]:p.kind===f).length;
function drawChips(){
  const defs=[['','전체',TOTAL],['★','★ 즐겨찾기',countOf('★')],null,['실습','실습',countOf('실습')],['실전','바이브 코딩',countOf('실전')],['참고','참고',countOf('참고')]];
  chips.innerHTML=defs.map(d=>d?`<button class="chip" type="button" data-f="${d[0]}" aria-pressed="${filter===d[0]}">${d[1]}<span class="n">${d[2]}</span></button>`:'<span class="sep"></span>').join('');
}
drawChips();
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.f;drawChips();apply();});

function boxHTML(b,long){
  const lines=b.text.split('\n').length;const clamp=long&&lines>12;
  return `<div class="box${clamp?' clamp':''}"><div class="box-h"><div class="l">${b.label?`<b>${esc(b.label)}</b>`:''}<span>📍 ${esc(b.where)}</span></div>
    <button class="copy" type="button" data-copy="${b.key}">${ICON_COPY}<span>복사</span></button></div><pre>${markVars(b.text)}</pre>
    ${clamp?`<button class="more" type="button" aria-expanded="false" data-n="${lines}">전체 보기 (${lines}줄) ▾</button>`:''}</div>`;
}
main.insertAdjacentHTML('beforeend',`<section class="hero" id="hero"><h1>배운 프롬프트, <em>필요할 때 바로</em> 꺼내 쓰기</h1>
  <p>KITA 무역 AX마스터 과정에서 실습한 프롬프트를 ${CATS.length}개 주제로 정리했어요. 찾고 싶은 말로 검색하거나, 카드의 복사 버튼을 눌러 Gemini·Claude에 그대로 붙여넣으세요.</p>
  <div class="stats"><div><b>${TOTAL}</b><span>프롬프트</span></div><div><b>${CATS.length}</b><span>주제</span></div><div><b>${ALL.filter(p=>p.kind==='실전').length}</b><span>바이브 코딩 예시</span></div><div><b>${PARTS.length}</b><span>PART</span></div></div>
  <div class="parts">${PARTS.map(pt=>`<a class="pcard" href="#${pt.cats[0].id}" style="--pc:var(--p${pt.no})"><small>PART ${pt.no}</small><strong>${pt.name}</strong><span>${pt.cats.map(c=>c.name).join(' · ')}</span></a>`).join('')}</div></section>`);
PARTS.forEach(pt=>{
  const pc=`--pc:var(--p${pt.no})`;
  nav.insertAdjacentHTML('beforeend',`<div class="lbl" style="${pc}"><i>PART ${pt.no}</i>${pt.name}</div>`);
  main.insertAdjacentHTML('beforeend',`<div class="part" data-part="${pt.no}" style="${pc}"><b>PART ${pt.no}</b><strong>${pt.name}</strong><span>${pt.sub}</span></div>`);
  pt.cats.forEach(c=>{
    nav.insertAdjacentHTML('beforeend',`<a href="#${c.id}" data-id="${c.id}"><span><i>${c.no}</i>${c.name}</span><em>${c.prompts.length}</em></a>`);
    const s=document.createElement('section');s.className='cat';s.id=c.id;s.dataset.part=pt.no;s.style.setProperty('--pc',`var(--p${pt.no})`);
    s.innerHTML=`<div class="cat-h"><div class="num">${c.no}</div><div class="eyebrow">${c.en}</div><h2>${c.name}</h2><p>${c.summary}</p></div>
      <div class="when">${c.when.map(w=>`<div><b>${w[0]}</b>${esc(w[1])}</div>`).join('')}</div>
      ${catExtras(c)}
      <div class="grid">${c.prompts.map(p=>{const x=promptExtras(p);return `
      <article class="card" data-id="${p.id}" data-kind="${p.kind}" data-s="${esc(searchText(p))}">
        <div class="meta"><span class="kind k-${p.kind}">${kindLabel(p.kind)}</span>${p.tool?`<span class="tool">${p.tool}</span>`:''}
          <button class="fav" type="button" aria-label="즐겨찾기" aria-pressed="${!!favs[p.id]}">${ICON_STAR}</button></div>
        <h3>${esc(p.t)}<small>${esc(p.sub)}</small></h3>
        <p class="desc">${esc(p.desc)}</p>
        <div class="boxes">${boxes(p).map((b,i)=>boxHTML(b,i===0)).join('')}</div>
        ${p.joinCopy?`<button class="copyall" type="button" data-copy="${p.id}:all">${ICON_COPY}<span>${joinLabel(p)}</span></button>`:''}
        ${x}
        ${p.note?`<p class="note">${esc(p.note)}</p>`:''}
      </article>`}).join('')}</div>`;
    main.appendChild(s);
  });
});
nav.insertAdjacentHTML('beforeend','<div class="legend"><div><mark>{값}</mark> 바꿔 넣거나 AI가 채울 자리</div><div>★ 자주 쓰는 프롬프트 모아 보기</div><div><kbd>/</kbd> 키로 바로 검색</div></div>');
main.insertAdjacentHTML('beforeend','<div class="empty" id="empty" hidden></div>');

const toast=document.getElementById('toast');let tt;
window.onCopied=btn=>{const p=BYID[btn.closest('[data-copy]').dataset.copy.split(':')[0]];toast.textContent=`복사했어요 · ${p.tool||'AI'} 채팅에 붙여넣으세요`;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1800);};
main.addEventListener('click',e=>{
  const ca=e.target.closest('.copyall');if(ca){copyText(textFor(ca.dataset.copy),ca.querySelector('span'),null);ca.classList.add('ok');setTimeout(()=>ca.classList.remove('ok'),1400);return;}
  const c=e.target.closest('.copy');if(c){const lab=c.querySelector('span');copyText(textFor(c.dataset.copy),lab,c.closest('.box').querySelector('pre'));c.classList.add('ok');setTimeout(()=>c.classList.remove('ok'),1400);return;}
  const f=e.target.closest('.fav');if(f){const id=f.closest('.card').dataset.id;favs[id]=!favs[id];if(!favs[id])delete favs[id];saveFavs();f.setAttribute('aria-pressed',!!favs[id]);drawChips();if(filter==='★')apply();return;}
  const m=e.target.closest('.more');if(m){const box=m.parentElement;const open=!box.classList.toggle('clamp');m.setAttribute('aria-expanded',open);m.textContent=open?'접기 ▴':`전체 보기 (${m.dataset.n}줄) ▾`;}
});
function apply(){
  let total=0;
  document.querySelectorAll('section.cat').forEach(s=>{
    let n=0;s.querySelectorAll('.card').forEach(c=>{const id=c.dataset.id;
      const ok=(filter===''||(filter==='★'?favs[id]:c.dataset.kind===filter))&&(!query||c.dataset.s.includes(query));c.hidden=!ok;if(ok)n++;});
    s.hidden=n===0;total+=n;const a=nav.querySelector(`a[data-id="${s.id}"]`);a.hidden=n===0;a.querySelector('em').textContent=n;
  });
  document.querySelectorAll('.part').forEach(g=>{g.hidden=![...document.querySelectorAll(`section.cat[data-part="${g.dataset.part}"]`)].some(s=>!s.hidden);});
  document.getElementById('hero').hidden=!!(filter||query);
  document.getElementById('count').textContent=(filter||query)?`${total}개 찾음`:`프롬프트 ${TOTAL}개`;
  const em=document.getElementById('empty');em.hidden=total>0;
  em.textContent=filter==='★'&&!query?'아직 즐겨찾기가 없어요. 카드 오른쪽 위 ☆를 눌러 모아 보세요.':'찾는 프롬프트가 없어요. 다른 단어로 검색하거나 필터를 “전체”로 바꿔 보세요.';
}
const q=document.getElementById('q');
q.addEventListener('input',()=>{query=q.value.trim().toLowerCase();apply();});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();}if(e.key==='Escape'&&document.activeElement===q){q.value='';query='';apply();q.blur();}});
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.id===en.target.id));}),{rootMargin:'-30% 0px -60% 0px'});
document.querySelectorAll('section.cat').forEach(s=>io.observe(s));
nav.querySelector('a').classList.add('on');
const totop=document.getElementById('totop');
addEventListener('scroll',()=>{totop.hidden=scrollY<900;},{passive:true});
totop.addEventListener('click',()=>scrollTo({top:0}));
apply();
initTheme(document.getElementById('tgl'));
</script>

</body>
</html>
