<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프롬프트 복습 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#f6f7fb;--surface:#fff;--ink:#12151f;--muted:#646b7d;--line:#e6e8ef;--accent:#3d5afe}
@media (prefers-color-scheme:dark){:root{--bg:#0d1019;--surface:#151926;--ink:#e8eaf2;--muted:#9aa1b6;--line:#252b3d;--accent:#8ea0ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.6;letter-spacing:-.01em}
main{max-width:980px;margin:0 auto;padding:64px max(20px,env(safe-area-inset-left,0px)) 64px max(20px,env(safe-area-inset-right,0px))}
small{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.045em;line-height:1.15;margin:10px 0 12px}
h1 em{font-style:normal;color:var(--accent)}
p{color:var(--muted);margin:0 0 36px;max-width:56ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
a{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;text-decoration:none;color:var(--ink);transition:border-color .2s,transform .2s}
a:hover{border-color:var(--accent);transform:translateY(-2px)}
a b{font-size:12px;color:var(--accent);letter-spacing:.1em}
a strong{font-size:20px;font-weight:800;letter-spacing:-.03em}
a span{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main>
<small>KITA 무역 AX마스터 · 프롬프트 복습 노트</small>
<h1>배운 프롬프트, <em>필요할 때 바로</em> 꺼내 쓰기</h1>
<p>같은 프롬프트 91개를 세 가지 방식으로 정리했어요. 보고 싶은 화면을 고르세요.</p>
<div class="grid">
<a href="library.html"><b>시안 A</b><strong>프롬프트 서재</strong><span>검색·필터·즐겨찾기로 찾아서 바로 복사</span></a>
<a href="cheatsheet.html"><b>시안 B</b><strong>프롬프트 한 장 정리</strong><span>22개 주제를 한 페이지 지도로 훑어보기</span></a>
<a href="practice.html"><b>시안 C</b><strong>프롬프트 연습장</strong><span>한 장씩 넘기며 빈칸 채우고 진도 체크</span></a>
</div>
</main>
</body>
</html>
